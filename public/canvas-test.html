<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Test</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0a0a0a;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      margin-bottom: 20px;
    }
    .canvas-wrapper {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      max-width: 1280px;
      margin: 0 auto;
      border: 1px solid #444;
    }
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }
    button {
      padding: 10px 20px;
      background: #0B84F3;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #0a75d9;
    }
    .status {
      margin-top: 20px;
      padding: 15px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 Canvas Rendering Test</h1>
    
    <div class="canvas-wrapper">
      <canvas id="testCanvas" width="1280" height="720"></canvas>
    </div>

    <div class="controls">
      <button onclick="testBasic()">Test Basic Render</button>
      <button onclick="testScene()">Test Scene Render</button>
      <button onclick="testAnimation()">Test Animation</button>
      <button onclick="clearCanvas()">Clear Canvas</button>
    </div>

    <div class="status" id="status">Ready. Click a button to test.</div>
  </div>

  <script>
    const canvas = document.getElementById('testCanvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');

    function log(message) {
      console.log(message);
      status.textContent += '\n' + message;
      status.scrollTop = status.scrollHeight;
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      log('Canvas cleared');
    }

    function testBasic() {
      log('Testing basic render...');
      
      // Clear
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Background
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Text
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 72px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Canvas Works!', canvas.width / 2, canvas.height / 2);
      
      log('✓ Basic render complete');
    }

    function testScene() {
      log('Testing scene render...');
      
      const scene = {
        text: 'Test Scene',
        backgroundColor: '#0f0c29',
        textColor: '#ffffff',
        fontSize: 64,
        animation: 'fadeIn',
        duration: 4,
        elements: [
          {
            type: 'shape',
            content: 'circle',
            position: { x: 50, y: 50 },
            size: { width: 100, height: 100 },
            color: '#e94560',
            opacity: 0.8,
            animation: 'pulse',
            delay: 0
          }
        ]
      };
      
      // Clear
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Background
      ctx.fillStyle = scene.backgroundColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Elements
      for (const element of scene.elements) {
        const x = (element.position.x / 100) * canvas.width;
        const y = (element.position.y / 100) * canvas.height;
        const w = (element.size.width / 100) * canvas.width;
        const h = (element.size.height / 100) * canvas.height;
        
        ctx.fillStyle = element.color;
        ctx.globalAlpha = element.opacity;
        
        if (element.content === 'circle') {
          ctx.beginPath();
          ctx.arc(x + w / 2, y + h / 2, Math.min(w, h) / 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      
      ctx.globalAlpha = 1;
      
      // Text
      ctx.fillStyle = scene.textColor;
      ctx.font = `bold ${scene.fontSize}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(scene.text, canvas.width / 2, canvas.height / 2);
      
      log('✓ Scene render complete');
    }

    function testAnimation() {
      log('Testing animation...');
      
      let progress = 0;
      const duration = 2000; // 2 seconds
      const startTime = Date.now();
      
      function animate() {
        const elapsed = Date.now() - startTime;
        progress = Math.min(elapsed / duration, 1);
        
        // Clear
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Background
        ctx.fillStyle = '#16213e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Animated circle
        const scale = 0.5 + progress * 0.5;
        const opacity = progress;
        
        ctx.save();
        ctx.globalAlpha = opacity;
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.scale(scale, scale);
        
        ctx.fillStyle = '#0f3460';
        ctx.beginPath();
        ctx.arc(0, 0, 150, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.restore();
        
        // Text
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 48px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`Progress: ${(progress * 100).toFixed(0)}%`, canvas.width / 2, canvas.height / 2);
        
        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          log('✓ Animation complete');
        }
      }
      
      animate();
    }

    // Initial test
    log('Canvas test page loaded');
    log('Canvas size: ' + canvas.width + 'x' + canvas.height);
    log('Context available: ' + !!ctx);
    
    // Auto run basic test
    setTimeout(testBasic, 500);
  </script>
</body>
</html>
